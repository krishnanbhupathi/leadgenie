name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The model client is faked in every test; no API key is needed or available here.
      - run: pytest -q

  eval-gate:
    # Replays recorded model responses against the golden test split and fails if any
    # threshold in evals/gate.json is missed. No API key, no spend. A replay miss (the
    # prompt, tools or agent changed since recording) fails the job: re-record locally.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Eval gate (replay)
        run: |
          if [ ! -f evals/cassettes/eval.jsonl ]; then
            echo "::warning::eval gate skipped: no recorded cassette at evals/cassettes/eval.jsonl"
            echo "Eval gate **skipped**: no recorded cassette yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          leadgenie eval --split test --replay --no-judge \
            --cassette evals/cassettes/eval.jsonl \
            --gate evals/gate.json --out "$RUNNER_TEMP/eval"
          cat "$RUNNER_TEMP"/eval/eval-test-*.md >> "$GITHUB_STEP_SUMMARY"
