[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadgenie"
version = "0.2.0"
description = "Agentic lead-enrichment and outreach pipeline with evals and a self-improving loop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11",
    "dnspython>=2.6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
leadgenie = "leadgenie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leadgenie"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["leadgenie"]
mypy_path = "src"
